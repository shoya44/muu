name = "muu"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "muu"

[vars]
# バケット合計の上限（バイト）。超えるアップロードは 507 で拒む。無料枠 10 GB の内側に置く。
MAX_BUCKET_BYTES = "9663676416"

[observability]
enabled = true
